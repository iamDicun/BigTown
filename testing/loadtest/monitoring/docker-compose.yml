# BigTown — Monitoring stack (Prometheus + Grafana + Node Exporter)
# Chỉ chạy khi test local (Strategy 1). KHÔNG chạy khi test qua Render (Strategy 2/3).
#
# Dựng:  docker compose -f docker-compose.yml up -d
# Dừng:  docker compose -f docker-compose.yml down
# Dọn:   docker compose -f docker-compose.yml down -v

services:
  prometheus:
    image: prom/prometheus
    container_name: bigtown-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=7d'

  grafana:
    image: grafana/grafana
    container_name: bigtown-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana-datasource.yml:/etc/grafana/provisioning/datasources/datasource.yml:ro
      - ./grafana-dashboard.yml:/etc/grafana/provisioning/dashboards/dashboard.yml:ro
      - ./grafana-dashboard.json:/etc/grafana/provisioning/dashboards/bigtown.json:ro

  node_exporter:
    image: prom/node-exporter
    container_name: bigtown-node-exporter
    ports:
      - "9100:9100"
    command:
      - '--collector.filesystem.mount-points-exclude=^(sys|proc|dev|host|etc|rootfs/var/lib/docker)($$|/)'

volumes:
  prometheus_data:
  grafana_data:
