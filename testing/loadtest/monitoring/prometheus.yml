# Prometheus scrape config — BigTown monitoring
# Backend chạy trên host (go run), Prometheus trong Docker scrape qua host.docker.internal

global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: 'bigtown-backend'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['host.docker.internal:8080']

  - job_name: 'node'
    static_configs:
      - targets: ['node_exporter:9100']
