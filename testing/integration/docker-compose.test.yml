version: '3.8'

services:
  postgres-test:
    image: postgres:16-alpine
    container_name: bigtown-postgres-test
    environment:
      POSTGRES_USER: test_user
      POSTGRES_PASSWORD: test_pass
      POSTGRES_DB: bigtown_test
    ports:
      - "5434:5432"
    volumes:
      - ../../backend/internal/database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ../../backend/internal/database/seed.sql:/docker-entrypoint-initdb.d/02_seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test_user -d bigtown_test"]
      interval: 2s
      timeout: 5s
      retries: 10
