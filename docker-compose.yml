services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: app_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/internal/database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./backend/internal/database/seed.sql:/docker-entrypoint-initdb.d/02_seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d app_db"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    image: golang:1.26-alpine
    working_dir: /app
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./backend:/app
    environment:
      PORT: "8080"
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: app_db
      DB_SSLMODE: disable
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      COOKIE_SECURE: "false"
      COOKIE_SAME_SITE: Lax
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
    command: go run cmd/server/main.go
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    image: node:22-alpine
    working_dir: /app
    restart: unless-stopped
    ports:
      - "3000:5173"
    volumes:
      - ./frontend:/app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    depends_on:
      - backend

volumes:
  postgres_data:
